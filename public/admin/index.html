<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Administrator | AllegoryNow</title>
    <link rel="icon" href="../favicon.svg">
    <link rel="stylesheet" href="./admin.css">
    <script src="./admin.js" defer></script>
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-header">
        <a class="admin-brand" href="../"><span aria-hidden="true">A</span><b>AllegoryNow</b></a>
        <div class="admin-actions" id="session-actions" hidden>
          <a href="./uploads.html">Review submissions</a>
          <a href="https://passion-4mg.pages.dev/" target="_blank" rel="noreferrer">View public site</a>
          <button class="text-button" id="logout-button" type="button">Lock editor</button>
        </div>
      </header>

      <main id="app" aria-live="polite">
        <section class="auth-card" id="loading-card">
          <p class="kicker">Secure administrator area</p>
          <h1>Checking your access…</h1>
          <p>The editor is verifying your authorized account.</p>
        </section>
      </main>
    </div>

    <template id="login-template">
      <section class="auth-card">
        <p class="kicker">Administrator sign-in</p>
        <h1>Unlock the editor.</h1>
        <p>This password is an additional layer after your authorized ChatGPT account.</p>
        <form id="login-form">
          <label>Administrator password<input name="password" type="password" minlength="16" maxlength="128" autocomplete="current-password" required></label>
          <button class="primary-button" type="submit">Unlock editor</button>
        </form>
        <p class="form-message" role="status"></p>
      </section>
    </template>

    <template id="setup-template">
      <section class="auth-card">
        <p class="kicker">One-time security setup</p>
        <h1>Create your administrator password.</h1>
        <p>Use at least 16 characters. A four-word passphrase is both strong and easier to remember. This password is never stored in readable form.</p>
        <form id="setup-form">
          <label>New password<input name="password" type="password" minlength="16" maxlength="128" autocomplete="new-password" required></label>
          <label>Confirm password<input name="confirm" type="password" minlength="16" maxlength="128" autocomplete="new-password" required></label>
          <button class="primary-button" type="submit">Create password</button>
        </form>
        <p class="form-message" role="status"></p>
      </section>
    </template>

    <template id="editor-template">
      <section class="editor-frame">
        <aside class="editor-sidebar">
          <div><p class="kicker">Administrator</p><h1>Website editor</h1><p>Select a page, edit its writing, save a draft, then publish when it is ready.</p></div>
          <nav id="page-picker" aria-label="Select a page to edit"></nav>
          <div class="version-box"><span id="draft-version"></span><span id="published-version"></span></div>
        </aside>
        <div class="editor-workspace">
          <div class="editor-toolbar">
            <div><p class="kicker" id="editor-kicker">Editing</p><h2 id="editor-title"></h2></div>
            <div class="toolbar-buttons"><button class="secondary-button" id="save-button" type="button">Save draft</button><button class="primary-button" id="publish-button" type="button">Publish changes</button></div>
          </div>
          <p class="editor-notice" id="editor-notice" role="status"></p>
          <form id="content-form" autocomplete="off"></form>
        </div>
      </section>
    </template>
  </body>
</html>
