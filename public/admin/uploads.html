<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Contribution Review | AllegoryNow</title>
    <link rel="icon" href="../favicon.svg">
    <link rel="stylesheet" href="./uploads.css">
    <script src="./uploads.js" defer></script>
  </head>
  <body>
    <div class="review-shell">
      <header class="review-header">
        <a class="brand" href="../"><span aria-hidden="true">A</span><b>AllegoryNow</b></a>
        <nav><a href="./index.html">Website editor</a><a href="/" target="_blank" rel="noreferrer">Public site</a></nav>
      </header>
      <main>
        <section class="review-intro">
          <div><p class="kicker">Administrator</p><h1>Contribution review</h1><p>Files are stored privately in Cloudflare R2. They are never published automatically. Download and inspect every file before using it.</p></div>
          <button id="refresh-button" type="button">Refresh</button>
        </section>
        <div class="review-tools" id="review-tools" hidden>
          <label>Status <select id="status-filter"><option value="all">All submissions</option><option value="new">New</option><option value="reviewed">Reviewed</option><option value="archived">Archived</option></select></label>
          <p id="summary"></p>
        </div>
        <p class="notice" id="notice" role="status" aria-live="polite">Checking your administrator session…</p>
        <section class="submission-list" id="submission-list"></section>
      </main>
    </div>
  </body>
</html>
